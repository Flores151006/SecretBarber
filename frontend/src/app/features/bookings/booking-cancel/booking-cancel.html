<div class="min-h-screen bg-background flex items-center justify-center px-4">
  <div class="max-w-md w-full text-center">

    <div class="w-20 h-20 bg-red-500/10 border border-red-500/30 rounded-full flex items-center justify-center mx-auto mb-6">
      <ng-icon name="lucideXCircle" class="text-red-400" style="font-size:2.2rem" />
    </div>

    <h1 class="font-serif text-3xl text-foreground font-bold mb-3">
      Pago cancelado
    </h1>
    <p class="text-foreground/50 mb-8">
      No se ha realizado ningún cargo. Puedes intentarlo de nuevo cuando quieras.
    </p>

    <div class="flex flex-col gap-3">
      <a routerLink="/reservas"
         class="bg-gold hover:bg-gold-light text-background font-bold py-3 rounded transition-colors">
        Intentar de nuevo
      </a>
      <a routerLink="/"
         class="border border-gold/30 text-gold hover:bg-gold/10 py-3 rounded transition-colors">
        Volver al inicio
      </a>
    </div>

  </div>
</div>
